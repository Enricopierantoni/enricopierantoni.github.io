<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Enrico Pierantoni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--fg:#ececec;--mute:#8a8a8a;--line:#2a2a2a;box-sizing:border-box;color-scheme:dark;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--fg);font-family:'Playfair Display',Georgia,'Times New Roman',serif;line-height:1.5}
a{color:inherit;text-decoration:none}
header{display:flex;justify-content:flex-end;align-items:center;padding:16px 14px}
.burger{background:none;border:0;width:26px;height:22px;padding:0;cursor:pointer;display:flex;flex-direction:column;justify-content:center;gap:6px}
.burger i{display:block;height:1px;background:var(--fg)}
nav{display:none;position:fixed;inset:0;background:var(--bg);z-index:5;padding:64px 14px;flex-direction:column;gap:14px;font-size:20px}
nav.open{display:flex}
nav button{position:absolute;top:12px;right:14px;background:none;border:0;color:var(--fg);font:inherit;font-size:26px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 6px;padding:6px 14px 50px}
.card{display:block;text-align:center}
.card h2{font-weight:400;font-size:12px;line-height:1.3;margin:8px 0 2px}
.price{color:var(--mute);font-size:11px}
.a4{aspect-ratio:210/297;width:100%;background-size:cover;background-position:center;border:1px solid var(--line)}
.sold .a4{opacity:.55}
.page{padding:0 14px 50px;max-width:440px;margin:0 auto}
.back{display:inline-block;color:var(--mute);font-size:13px;margin:2px 0 12px}
.page .a4{max-width:100%;margin:0 auto;display:block}
.thumbs{display:flex;gap:8px;justify-content:center;margin:10px 0 18px}
.thumbs .a4{width:42px;cursor:pointer;opacity:.6}
.thumbs .a4.on{opacity:1}
.page h1{font-weight:400;font-size:20px;line-height:1.2;margin:6px 0 6px}
.page p{margin:0 0 8px;font-size:14px}
.buy{display:inline-block;margin:8px 0 18px;padding:9px 26px;border:1px solid var(--fg);font:inherit;font-size:14px;color:var(--fg);background:none;cursor:pointer}
.buy:hover,.buy:focus-visible{background:var(--fg);color:var(--bg)}
.buy[aria-disabled=true]{border-color:var(--line);color:var(--mute);pointer-events:none}
.small{color:var(--mute);font-size:12px}
footer{padding:18px 14px 26px;color:var(--mute);font-size:11px;border-top:1px solid var(--line)}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr);max-width:880px;margin:0 auto}}
</style>
</head>
<body>
<header><button class="burger" aria-label="Menu" id="open"><i></i><i></i><i></i></button></header>
<nav id="nav"><button id="close" aria-label="Close">&times;</button><a href="#/">Shop</a><a href="#/">Sold works</a><a href="#/">Commissions</a><a href="#/">About</a><a href="#/">Contact</a></nav>
<main id="app"></main>
<footer>Copyright &copy; Enrico Pierantoni. All rights reserved.</footer>
<script>
/* EDIT HERE: title, price, sold:true to mark as sold, stripe:"Stripe payment link" (if empty, the button opens an Instagram message). */
const OPERE=[
{id:"opera-1",titolo:"Untitled I",prezzo:65,img:["opera-1.jpg"],stripe:"",sold:false,tecnica:"Ink on paper",misure:"21 x 29.7 cm (A4)"},
{id:"opera-2",titolo:"Untitled II",prezzo:65,img:["opera-2.jpg"],stripe:"",sold:false,tecnica:"Ink on paper",misure:"21 x 29.7 cm (A4)"},
{id:"opera-3",titolo:"Untitled III",prezzo:65,img:["opera-3.jpg"],stripe:"",sold:false,tecnica:"Ink on paper",misure:"21 x 29.7 cm (A4)"},
{id:"opera-4",titolo:"Untitled IV",prezzo:65,img:["opera-4.jpg"],stripe:"",sold:false,tecnica:"Ink on paper",misure:"21 x 29.7 cm (A4)"},
{id:"opera-5",titolo:"Untitled V",prezzo:90,img:["opera-5.jpg"],stripe:"",sold:false,tecnica:"Ink on paper",misure:"21 x 29.7 cm (A4)"}
];
const IG="enricopier_";
const app=document.getElementById('app');
const nav=document.getElementById('nav');
document.getElementById('open').onclick=()=>nav.classList.add('open');
document.getElementById('close').onclick=()=>nav.classList.remove('open');
nav.onclick=e=>{if(e.target.tagName==='A')nav.classList.remove('open')};
function bg(o,i){return `background-image:url('${o.img[i]}')`}
function fmt(n){return '€'+n.toFixed(2)}
function shop(){
app.innerHTML='<div class="grid">'+OPERE.map(o=>`<a class="card ${o.sold?'sold':''}" href="#/${o.id}"><div class="a4" style="${bg(o,0)}"></div><h2>${o.titolo}</h2><div class="price">${fmt(o.prezzo)}${o.sold?' Sold':''}</div></a>`).join('')+'</div>';
}
function opera(id){
const o=OPERE.find(x=>x.id===id);if(!o)return shop();
app.innerHTML=`<div class="page"><a class="back" href="#/">&lsaquo; Back to shop</a>
<div class="a4" id="main" style="${bg(o,0)}"></div>
${o.img.length>1?`<div class="thumbs">${o.img.map((_,i)=>`<div class="a4 ${i?'':'on'}" data-i="${i}" style="${bg(o,i)}"></div>`).join('')}</div>`:'<div style="height:16px"></div>'}
<h1>${o.titolo}</h1><p>${fmt(o.prezzo)}</p>
<p class="small">Shipping calculated at checkout.</p>
${o.sold?'<span class="buy" aria-disabled="true">Sold</span>':(o.stripe?`<a class="buy" href="${o.stripe}">Buy</a>`:`<a class="buy" href="https://ig.me/m/${IG}">Message me to buy</a>`)}
<p>${o.tecnica}</p><p>${o.misure}</p><p>Ships rolled up, without frame.</p>
<p class="small">Final sale. Each original work is one of a kind, so returns are not accepted.</p></div>`;
document.querySelectorAll('.thumbs .a4').forEach(t=>t.onclick=()=>{document.getElementById('main').setAttribute('style',t.getAttribute('style'));document.querySelectorAll('.thumbs .a4').forEach(x=>x.classList.remove('on'));t.classList.add('on')});
}
function route(){const h=location.hash.replace('#/','');window.scrollTo(0,0);h?opera(h):shop()}
addEventListener('hashchange',route);route();
</script>
</body>
</html>
